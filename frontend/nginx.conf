server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy ke Backend via Tailscale WireGuard Mesh
    location /api/ {
        proxy_pass http://100.118.230.58:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Reverse proxy ke Swagger OpenAPI Docs
    location /docs {
        proxy_pass http://100.118.230.58:8000/docs;
    }
    location /openapi.json {
        proxy_pass http://100.118.230.58:8000/openapi.json;
    }
}
