<!DOCTYPE html>
<html lang="id" class="h-full bg-slate-900 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Dosen / Pengampu - Kelompok 5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        code, .font-mono { font-family: 'JetBrains Mono', monospace; }
    </style>
</head>
<body class="min-h-full flex flex-col justify-center items-center bg-slate-950 p-4 antialiased selection:bg-indigo-600 selection:text-white">

    <div class="max-w-md w-full space-y-6">
        <!-- Brand / Header -->
        <div class="text-center">
            <div class="inline-flex h-14 w-14 rounded-2xl bg-indigo-600 items-center justify-center text-white shadow-xl shadow-indigo-600/30 mb-4">
                <i data-lucide="graduation-cap" class="w-7 h-7"></i>
            </div>
            <h1 class="text-2xl font-extrabold text-white tracking-tight">Konsol Manajemen Dosen</h1>
            <p class="text-sm text-slate-400 mt-1">Sistem Presensi Terdistribusi • Kelompok 5 (Sister E)</p>
        </div>

        <!-- Login Card -->
        <div class="rounded-2xl border border-slate-800 bg-slate-900/80 p-8 shadow-2xl backdrop-blur">
            <!-- Error Alert -->
            <div id="login-error" class="hidden mb-5 p-3.5 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-300 text-xs flex items-center gap-2">
                <i data-lucide="alert-circle" class="w-4 h-4 shrink-0"></i>
                <span id="login-error-text"></span>
            </div>

            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Username Pengajar</label>
                    <div class="relative">
                        <i data-lucide="user" class="w-4 h-4 text-slate-500 absolute left-3.5 top-3"></i>
                        <input type="text" id="username" required placeholder="dosen" value="dosen" class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-950 border border-slate-800 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 text-white text-sm transition">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Kata Sandi</label>
                    <div class="relative">
                        <i data-lucide="lock" class="w-4 h-4 text-slate-500 absolute left-3.5 top-3"></i>
                        <input type="password" id="password" required placeholder="••••••••" value="kelompok5" class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-950 border border-slate-800 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 text-white text-sm transition">
                    </div>
                </div>

                <!-- Demo Hint Box -->
                <div class="p-3 rounded-xl bg-slate-950 border border-slate-800 text-xs text-slate-400 flex items-center justify-between">
                    <div>
                        <div class="font-semibold text-slate-300">Kredensial Demo Dosen:</div>
                        <div class="font-mono text-[11px] text-indigo-400">user: dosen | pass: kelompok5</div>
                    </div>
                    <button type="button" onclick="document.getElementById('username').value='dosen'; document.getElementById('password').value='kelompok5';" class="text-xs text-indigo-400 hover:text-indigo-300 font-semibold px-2 py-1 rounded bg-indigo-500/10 border border-indigo-500/20">Isi</button>
                </div>

                <button type="submit" id="btn-submit" class="w-full py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold shadow-lg shadow-indigo-600/30 transition flex items-center justify-center gap-2 mt-4">
                    <span>Masuk ke Dashboard Dosen</span>
                    <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>
            </form>

            <div class="mt-6 pt-5 border-t border-slate-800/80 text-center">
                <a href="/index.html" class="text-xs text-slate-400 hover:text-white transition flex items-center justify-center gap-1.5 font-medium">
                    <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
                    <span>Kembali ke Portal Presensi Mahasiswa</span>
                </a>
            </div>
        </div>

        <div class="text-center text-xs text-slate-600">
            Microservices Proxmox VE & Tailscale Mesh • Kelompok 5
        </div>
    </div>

    <script>
        const API_BASE = '/api';

        async function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            const errBox = document.getElementById('login-error');
            const errText = document.getElementById('login-error-text');
            const btn = document.getElementById('btn-submit');

            btn.disabled = true;
            btn.innerHTML = '<span>Memverifikasi Otoritas...</span>';
            errBox.classList.add('hidden');

            try {
                const res = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ username: u, password: p })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || 'Login gagal');

                // Simpan token otentikasi
                localStorage.setItem('sister_dosen_auth', 'true');
                localStorage.setItem('sister_dosen_user', data.name);
                localStorage.setItem('sister_dosen_token', data.token);

                window.location.href = '/dosen/index.html';
            } catch (err) {
                errText.innerText = err.message;
                errBox.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<span>Masuk ke Dashboard Dosen</span><i data-lucide="arrow-right" class="w-4 h-4"></i>';
                lucide.createIcons();
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
        });
    </script>
</body>
</html>
